# [1] 역할
#     스프링 부트가 시작할 때 읽는 설정 파일이다(내 PC 모드). 코드에 적지 않고 바꿀 수 있는 값을 모아 둔다.
#     YAML 모양: 들여쓰기로 층을 나눈다. publisher: 아래 root: 는 "publisher.root" 라는 이름이 된다.
#     ${이름:기본값} = 환경변수 이름이 있으면 그 값, 없으면 콜론 뒤의 기본값.
#
# [2] 받는 것 → 내보내는 것 (실제로 실행해서 얻은 값)
#     받는 것  : 환경변수 (없으면 기본값)       예) PUBLISHER_ROOT 없음 → "~/my-publisher"
#     내보내는 것: 코드가 읽는 설정 값
#       publisher.root            → config/PublisherProperties.java 의 rootPath() = /root/my-publisher
#       publisher.scan-interval-ms → scan/ScanScheduler.java 의 @Scheduled = 10000 (10초)
#       publisher.bridge-url       → client/FakechatClient.java 의 @Value = http://127.0.0.1:8787
#       server.port                → 8080 (환경변수 PORT=8097 이면 8097)
#       management…include: health → GET /actuator/health = {"status":"UP"},  GET /actuator/env = 404
#
# [3] 앞뒤 파일
#     (이 파일)  →  config/PublisherProperties.java (@ConfigurationProperties("publisher")), client/FakechatClient.java (@Value)
#     서버(prod) 모드에서는 (이 파일) 위에 application-prod.yml 의 값이 덮어쓴다
#
# [4] 메서드 목록
#     구역                   하는 일
#     publisher              출판사 폴더, 대화 기록 폴더, 읽기 간격, fakechat 주소, 직원 명부, 로그인 켜기
#     server                 포트, 세션을 쿠키로만
#     spring.datasource      DB 주소 (내 PC 는 H2 파일 DB)
#     spring.jpa             엔티티를 보고 표를 만들거나 고친다(update)
#     spring.flyway          내 PC 에서는 끔
#     spring.thymeleaf       템플릿 캐시 끔 (HTML 을 고치면 바로 보이게)
#     logging                로그 양
#     management             /actuator/health 만 연다
#
# [5] 먼저 알 용어 (자세한 설명: docs/용어-풀이.md)
#     YAML, ${환경변수:기본값}, 프로필(profile), H2, ddl-auto, @ConfigurationProperties, @Value
#
# [6] 읽는 순서
#     publisher → server → spring.datasource → spring.jpa → 나머지
#
# [7] 다 읽고 확인
#     - 환경변수 PORT=9090 을 주고 켜면 어느 주소로 열어야 하는가? (http://localhost:9090)
#     - ddl-auto: update 는 엔티티에 필드를 하나 더하면 DB 에 무슨 일을 하는가? (열을 더한다. 지우지는 않는다)
# 1인 AI 출판사 관리 화면 설정
# 경로는 환경변수로 바꿀 수 있어요 (IntelliJ 실행 설정의 Environment variables 칸)
#   PUBLISHER_ROOT              : 출판사 폴더 (기본 ~/my-publisher)
#   PUBLISHER_CLAUDE_PROJECTS   : Claude 대화 기록 폴더 (기본 ~/.claude/projects)
#   PUBLISHER_TRANSCRIPTS_DIR   : 대화 기록 폴더를 직접 지정 (비우면 자동)
#   PUBLISHER_BRIDGE            : 쭌과 연결하는 주소 (fakechat, 기본 http://127.0.0.1:8787)
#   PUBLISHER_STAFF_FILE        : 직원 명부 파일 (기본: 출판사 폴더/staff.yml)
# 서버(라이트세일)에서는 --spring.profiles.active=prod 로 켜고 application-prod.yml 을 함께 씁니다.
# publisher.* : 이 프로그램만의 설정. config/PublisherProperties.java 가 한꺼번에 읽는다.
publisher:
  root: ${PUBLISHER_ROOT:~/my-publisher}
  claude-projects: ${PUBLISHER_CLAUDE_PROJECTS:~/.claude/projects}
  transcripts-dir: ${PUBLISHER_TRANSCRIPTS_DIR:}
  # 책 폴더·대화 기록을 다시 읽는 간격(밀리초). 10000 = 10초 (흐름 F-①)
  scan-interval-ms: 10000
  # 쭌의 fakechat 서버 주소. FakechatClient 가 POST /upload 를 보낼 곳 (흐름 B-③)
  bridge-url: ${PUBLISHER_BRIDGE:http://127.0.0.1:8787}
  staff-file: ${PUBLISHER_STAFF_FILE:}
  security:
    # 내 PC 에서는 로그인 없이 씀. 서버(prod)에서는 true + BOSS_USERNAME / BOSS_PASSWORD
    # config/SecurityConfig.java 가 이 값을 본다. false 면 모든 주소를 로그인 없이 연다.
    enabled: false
    username: ${BOSS_USERNAME:boss}
    password: ${BOSS_PASSWORD:}

server:
  # 관리 화면 포트. 결과: http://localhost:8080
  port: ${PORT:8080}
  servlet:
    session:
      # 세션 번호를 주소(;jsessionid=…)에 붙이지 않고 쿠키로만 주고받기
      # 세션 번호를 쿠키로만 주고받는다. 없으면 첫 방문 때 링크 주소 뒤에 ;jsessionid=… 가 붙을 수 있다.
      tracking-modes: cookie

spring:
  application:
    name: publisher-dashboard
  datasource:
    # H2 = 자바로 만든 작은 DB. 파일 하나(~/.publisher-dashboard/db.mv.db)에 저장한다. 따로 설치할 필요가 없다.
    # AUTO_SERVER=TRUE: 관리 화면이 켜져 있어도 다른 프로그램(IntelliJ 의 DB 창 등)이 같은 파일에 접속할 수 있다.
    url: jdbc:h2:file:${PUBLISHER_DB:~/.publisher-dashboard/db};AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # ddl-auto: update = 시작할 때 엔티티(domain/*.java)와 표를 비교해 없는 표·열을 만든다.
      # 실제 로그 예) create table book_order (id bigint generated by default as identity, at timestamp(6) with time zone, chat_key varchar(255), text clob, primary key (id))
      ddl-auto: update
    # open-in-view: false = DB 연결을 서비스 메서드(@Transactional) 안에서만 쓴다. 템플릿을 그리는 동안에는 DB 를 읽지 않는다.
    open-in-view: false
  h2:
    console:
      enabled: false
  flyway:
    # 내 PC(H2)는 JPA 가 표를 만들고, 서버(MySQL)는 Flyway 가 db/migration 의 SQL 로 만든다
    enabled: false
  thymeleaf:
    # 템플릿 캐시 끔: templates/*.html 을 고치고 새로고침하면 다시 시작하지 않아도 바뀐 화면이 보인다.
    cache: false

logging:
  level:
    root: warn
    # 우리 코드의 로그는 info 부터 보인다.  예) "관리 화면 준비 완료: 책 5권, 기록 383건 읽음 → http://localhost:8080"
    com.greendesk.publisher: info

# 상태 확인 주소(/actuator/health)만 연다 — 배포 후 '살아 있나' 확인용
management:
  endpoints:
    web:
      exposure:
        # /actuator/health 만 연다.  실제) GET /actuator/health → {"status":"UP"}   GET /actuator/env → 404
        # 배포 스크립트가 이 주소로 "켜졌는지"를 확인한다.
        include: health
  endpoint:
    health:
      show-details: never
