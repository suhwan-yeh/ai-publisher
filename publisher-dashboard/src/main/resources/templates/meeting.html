<!doctype html>
<!--/*
  [1] 역할
      회의실 화면(GET /meeting)의 템플릿이다. 원탁 그림(SVG)과 화이트보드·회의록의 빈 자리를 그린다.
      사람·빛줄기·말풍선·회의록 줄은 meeting.js 가 GET /api/meeting 응답으로 채운다. 컨트롤러가 넘기는 model 값이 없다.
      이 파일의 주석은 타임리프 전용 주석이다(docs/용어-풀이.md 의 "타임리프 주석"). 타임리프가 HTML 을 만들 때 지우므로 브라우저(F12)에는 보이지 않는다.
  
  [2] 받는 것 → 내보내는 것 (실제로 실행해서 얻은 값)
      받는 것 : 없음 (OfficePageController.meeting() 은 "meeting" 만 돌려준다)
      내보내는 것 : 원탁 SVG + 빈 자리 <g id="beams">, <g id="seats">, <div id="mbubbles">, <div id="mlog"> + script 두 개
      그 뒤  meeting.js → GET /api/meeting?after=0 → 자리에 사람 그림, 회의록에 줄
  
  [3] 앞뒤 파일
      controller/OfficePageController.java 의 meeting()  →  (이 파일)  →  static/js/people.js → meeting.js
  
  [4] 메서드 목록
      구역                     id                              채우는 곳
      상태·다시 보기 단추       mstate, rp-book, rp-play, rp-live, data-speed   meeting.js
      원탁 SVG                  room (안에 beams, seats)         meeting.js speak(), seat()
      말풍선 층                  mbubbles                        meeting.js speak()
      화이트보드                 wb-title, wb-stage, wb-ch, wb-notes   meeting.js whiteboard()
      회의록                     mlog                            meeting.js minute()
  
  [5] 먼저 알 용어 (자세한 설명: docs/용어-풀이.md)
      SVG(viewBox, ellipse, g, defs, radialGradient, filter), data-speed, aria-label
  
  [6] 읽는 순서
      다시 보기 단추 → 원탁 SVG 의 beams·seats → 화이트보드 → 회의록 → script
  
  [7] 다 읽고 확인
      - 사람 그림을 넣는 <g id="seats"> 가 <g id="beams"> 보다 뒤에 있는 이유는? (SVG 는 뒤에 적은 것이 위에 그려진다. 빛줄기가 사람 아래로 지나간다)
      - 2× 단추의 data-speed 값은 meeting.js 에서 어떤 자료형이 되는가? (+ 로 바꾼 숫자 2)
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회의실 · 1인 AI 출판사</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/office.css">
</head>
<body class="night">
<header th:replace="~{fragments :: header}"></header>
<main class="meeting">
  <section class="mroom glass">
    <div class="mroom-top">
      <h2>🗣 팀 회의실</h2>
      <!--/* 상태 표시. meeting.js 의 setState() 가 "회의 중 / 회의 쉬는 중 / 다시 보기 중 · 2×" 로 바꾼다. */-->
      <span class="mstate" id="mstate">불러오는 중…</span>
      <div class="replay">
        <!--/* 다시 볼 책 고르기. meeting.js 의 loadBooks() 가 GET /api/books 응답으로 <option> 을 넣는다. */-->
        <select id="rp-book" aria-label="다시 볼 책"><option value="">다시 볼 책 고르기</option></select>
        <button type="button" id="rp-play">▶ 다시 보기</button>
        <!--/* data-speed = 재생 빠르기. meeting.js 가 눌린 단추의 값을 speed 에 넣는다. */-->
        <button type="button" data-speed="1" class="on">1×</button>
        <button type="button" data-speed="2">2×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" id="rp-live" hidden>● 실시간으로</button>
      </div>
    </div>
    <div class="mstage">
      <div class="tablewrap" id="tablewrap">
        <!--/* 원탁 그림. viewBox 0 0 640 440 = 그림 안 좌표의 가로 640, 세로 440. meeting.js 의 SPOTS 좌표와 VB 가 이 값을 쓴다. */-->
        <svg id="room" viewBox="0 0 640 440" aria-label="회의 테이블">
          <!--/* <defs>: 다시 쓸 그림 재료(색이 퍼지는 칠 radialGradient, 빛나는 효과 filter)를 정의한다. 아래에서 url(#tableTop) 처럼 쓴다. */-->
          <defs>
            <radialGradient id="tableTop" cx="50%" cy="40%" r="70%">
              <stop offset="0%" stop-color="#3b2c22"/><stop offset="60%" stop-color="#2a1f19"/><stop offset="100%" stop-color="#1b1411"/>
            </radialGradient>
            <linearGradient id="tableGlass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,.18)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <ellipse cx="320" cy="236" rx="214" ry="122" fill="rgba(0,0,0,.35)"/>
          <!--/* 원탁 윗면: 가운데 (320, 228), 가로 반지름 200, 세로 반지름 110. 빛줄기 곡선이 이 가운데를 지난다. */-->
          <ellipse cx="320" cy="228" rx="200" ry="110" fill="url(#tableTop)" stroke="#6b4b34" stroke-width="3"/>
          <ellipse cx="320" cy="214" rx="170" ry="80" fill="url(#tableGlass)" opacity=".5"/>
          <g id="props" opacity=".9">
            <rect x="282" y="206" width="76" height="44" rx="6" fill="#f2efe8" transform="rotate(-4 320 228)"/>
            <rect x="290" y="214" width="60" height="4" rx="2" fill="#c9c3b8" transform="rotate(-4 320 228)"/>
            <rect x="290" y="224" width="44" height="4" rx="2" fill="#c9c3b8" transform="rotate(-4 320 228)"/>
            <circle cx="236" cy="236" r="9" fill="#e9e1d4"/><circle cx="410" cy="214" r="9" fill="#e9e1d4"/>
          </g>
          <!--/* 빛줄기(path)를 넣는 곳. 사람(seats)보다 먼저 적어 사람 아래에 그려진다. */-->
          <g id="beams"></g>
          <g id="seats"></g>
        </svg>
        <div id="mbubbles"></div>
      </div>
      <div class="whiteboard" id="wb">
        <h3 id="wb-title">회의 주제를 기다려요</h3>
        <span class="stage-now" id="wb-stage" hidden></span>
        <ol id="wb-ch"></ol>
        <div id="wb-notes"></div>
      </div>
    </div>
  </section>
  <aside class="minutes glass">
    <h2>📝 회의록</h2>
    <div class="legend"><span class="cat cat-지시">지시</span> 쭌 → 직원 <span class="cat cat-보고">보고</span> 직원 → 쭌 <span class="cat cat-의논">의논</span> 직원끼리 <span class="cat cat-알림">알림</span></div>
    <!--/* 회의록 줄이 쌓이는 곳. aria-live 로 새 줄을 화면 읽기 프로그램이 읽어 준다. */-->
    <div class="mlog" id="mlog" aria-live="polite"></div>
  </aside>
</main>
<!--/* people.js 를 먼저(window.Publisher), 그다음 meeting.js. */-->
<script src="/js/people.js"></script>
<script src="/js/meeting.js"></script>
</body>
</html>
