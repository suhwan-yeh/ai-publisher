/*
 * [1] 역할
 *     Gradle 이 이 프로젝트를 만들 때 읽는 파일이다. 자바 버전, 쓰는 라이브러리(의존성), 실행 파일(jar) 이름을 정한다.
 *     ./gradlew test 는 테스트를, ./gradlew bootJar 는 build/libs/publisher-dashboard.jar 를 만든다.
 *
 * [2] 받는 것 → 내보내는 것 (실제로 실행해서 얻은 값)
 *     받는 것  : ./gradlew bootJar
 *     내보내는 것: build/libs/publisher-dashboard.jar (약 66MB, 라이브러리를 모두 담은 실행 파일)
 *       실행: java -jar build/libs/publisher-dashboard.jar
 *       실제 로그) Starting PublisherDashboardApplication v1.0.0 using Java 21.0.12.1
 *
 * [3] 앞뒤 파일
 *     (이 파일)  →  src/main/java/** 를 컴파일  →  src/test/java/** 를 테스트  →  build/libs/publisher-dashboard.jar
 *
 * [4] 메서드 목록
 *     구역            하는 일
 *     plugins         자바, 스프링 부트(3.4.5), 의존성 버전 관리
 *     group·version   jar 안에 적히는 이름과 버전 (v1.0.0)
 *     java            자바 21 로 컴파일
 *     repositories    라이브러리를 받을 곳 (Maven Central)
 *     dependencies    쓰는 라이브러리 목록
 *     tasks           테스트는 JUnit 5, jar 이름 고정
 *
 * [5] 먼저 알 용어 (자세한 설명: docs/용어-풀이.md)
 *     Gradle, 의존성(implementation, runtimeOnly, testImplementation), 스타터(spring-boot-starter-…), bootJar
 *
 * [6] 읽는 순서
 *     plugins → dependencies → tasks
 *
 * [7] 다 읽고 확인
 *     - spring-boot-starter-validation 을 지우면 SendMessageRequest 의 @NotBlank 는 어떻게 되는가? (검사가 실행되지 않아 빈 글이 서비스까지 간다)
 *     - runtimeOnly 와 implementation 의 차이는? (runtimeOnly 는 컴파일할 때는 없고 실행할 때만 있다)
 */
plugins {
    id 'java'
    // 스프링 부트 플러그인: bootJar(실행 jar 만들기), bootRun 작업을 더한다.
    id 'org.springframework.boot' version '3.4.5'
    // 아래 라이브러리에 버전을 적지 않아도 스프링 부트 3.4.5 에 맞는 버전을 고른다.
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.greendesk'
version = '1.0.0'

java {
    toolchain {
        // 자바 21 로 컴파일한다. record, var, 텍스트 블록 등을 쓴다.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web     : Spring MVC + 내장 Tomcat(웹 서버) + Jackson(JSON). @Controller, @RestController, 8080 포트가 여기서 온다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // thymeleaf : templates/*.html 의 th:… 를 처리한다.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // data-jpa : JPA(Hibernate) + Spring Data. @Entity, JpaRepository 가 여기서 온다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // validation : @Valid, @NotBlank, @Size 검사를 실행한다 (흐름 D-①).
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 서버(라이트세일) 배포용: 로그인, 상태 확인, DB 변경 이력(Flyway), MySQL
    // security : 로그인·CSRF. 서버 모드에서 SecurityConfig 가 켠다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // actuator : /actuator/health
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // flyway : db/migration/V1__init.sql 같은 SQL 파일을 순서대로 한 번씩 실행한다(서버 모드).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    // 템플릿의 sec:authorize 를 쓰게 한다 (fragments.html 의 로그아웃 단추).
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // runtimeOnly: 실행할 때만 필요한 것. h2 = 내 PC 의 DB, mysql-connector-j = 서버의 MySQL 에 접속하는 드라이버.
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // 테스트에만 쓰는 것: JUnit 5, MockMvc, AssertJ 등.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    // jar 이름을 버전 없이 고정한다. 배포 스크립트가 이 이름을 찾는다.
    archiveFileName = 'publisher-dashboard.jar'
}

tasks.named('jar') {
    // 라이브러리를 뺀 보통 jar(…-plain.jar)는 만들지 않는다.
    enabled = false
}
